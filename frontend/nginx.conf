# nginx.conf
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 80;
    server_name localhost; # Możesz zmienić na domenę, jeśli ją masz

    # --- POPRAWKA ---
    # Poprzednio: root /opt/guarantee-manager/frontend/dist/guarantee-manager/browser;
    # Poprawna ścieżka wewnątrz kontenera Nginx, gdzie skopiowano pliki Angulara
    root /usr/share/nginx/html;
    # --- KONIEC POPRAWKI ---

    index index.html;

    # Kluczowe dla routingu w Angularze - wszystkie ścieżki kierują do index.html
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Przekierowanie strony błędu 404 na index.html, aby Angular mógł obsłużyć nieznalezione ścieżki
    error_page 404 /index.html;

    # Nagłówki bezpieczeństwa (bez zmian, są w porządku)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}
