worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 80;
    server_name guarantee-manager.duckdns.org;

    # Serwowanie aplikacji frontendowej (Angular)
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;  # Obsługuje nawigację po stronie klienta
    }

    # Proxy dla API backendu (Spring Boot)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;  # Zakładając, że backend działa na porcie 8081
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Obsługa błędów 404 (zwracanie index.html dla nieznalezionych zasobów)
    error_page 404 /index.html;

    # Dodanie nagłówków bezpieczeństwa
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
  }
}
