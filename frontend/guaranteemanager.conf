server {
    listen 80;
    server_name guarantee-manager.duckdns.org;

    # Przekierowanie dla API
    location /api/ {
        client_max_body_size 5M;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serwowanie statycznych plików aplikacji
    location / {
        root /var/www/guarantee-manager;  # Ścieżka do katalogu z plikami frontendu
        try_files $uri $uri/ /index.html;  # Obsługuje routing w aplikacjach SPA
    }

    # Opcjonalnie - określenie nagłówków bezpieczeństwa
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
