server {
    listen 80;
    server_name 157.180.16.111;  # Możesz tu użyć swojego adresu IP lub domeny, jeśli masz

    # Serwowanie plików z aplikacji Angular
    root /var/www/guarantee-manager;  # Ścieżka do katalogu, w którym znajdują się pliki aplikacji Angular
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;  # Wymusza przekierowanie na index.html dla routingu Angulara
    }

    # Obsługa API
    location /api/ {
        proxy_pass http://127.0.0.1:8081;  # Przekazywanie zapytań API na lokalny serwer
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Opcjonalne dodanie błędu 404 (taki jak w Twojej oryginalnej konfiguracji)
    error_page 404 /index.html;
}
