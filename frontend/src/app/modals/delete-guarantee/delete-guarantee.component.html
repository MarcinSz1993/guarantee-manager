<div class="modal fade show d-block" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header bg-danger bg-gradient">
        <h5 class="modal-title">Delete guarantee</h5>
        <button type="button" class="btn-close" (click)="onClose()"></button>
      </div>
      <div class="modal-body bg-dark bg-gradient">
        <p>Choose the guarantee to delete:</p>
        <select id="guaranteeSelect" class="form-select" [(ngModel)]="selectedGuaranteeIdToDelete">
          <option *ngFor="let guarantee of allGuarantees.content" [value]="guarantee.id">{{ guarantee.brand }} {{guarantee.model}}</option>

        </select>
      </div>
      <div class="modal-footer bg-dark bg-gradient">
        <button class="btn btn-secondary" (click)="onClose()">Cancel</button>
        <button class="btn btn-danger" (click)="deleteGuarantee()">Delete</button>
      </div>
    </div>
  </div>
</div>
