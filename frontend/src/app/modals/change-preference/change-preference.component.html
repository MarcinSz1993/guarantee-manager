<div class="modal fade show d-block" tabindex="-1" (click)="onClose()">
  <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header text-bg-primary bg-gradient">
        <h5 class="modal-title">🔧 Change Notification Preference</h5>
        <button type="button" class="btn-close" (click)="closeModal.emit()"></button>
      </div>
      <div class="modal-body text-bg-primary bg-gradient">
        <p><strong>Current Preference:</strong> {{ currentPreference }}</p>
        <label for="preferenceSelect" class="form-label">Choose new preference:</label>
        <select id="preferenceSelect" class="form-select" [(ngModel)]="selectedPreference">
          <option value="EMAIL">EMAIL</option>
          <option value="DASHBOARD">DASHBOARD</option>
          <option value="ALL">ALL</option>
        </select>
      </div>
      <div class="modal-footer text-bg-primary bg-gradient">
        <button type="button" class="btn btn-secondary" (click)="closeModal.emit()">Close</button>
        <button type="button" class="btn btn-success" (click)="savePreference(selectedPreference)">Save changes</button>
      </div>
    </div>
  </div>
</div>
