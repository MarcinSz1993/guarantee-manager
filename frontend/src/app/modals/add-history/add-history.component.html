<div class="modal fade show" tabindex="-1" role="dialog" style="display: block;" aria-labelledby="addGuaranteeHistoryModalLabel" aria-hidden="false">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header bg-dark-subtle bg-gradient">
        <h5 class="modal-title" id="addGuaranteeHistoryModalLabel">Add Guarantee History</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body bg-info">
        <form (ngSubmit)="addGuaranteeHistory()">
          <div class="mb-3">
            <label for="guaranteeName" class="form-label">Guarantee</label>
            <select class="form-select bg-info-subtle" id="guaranteeName" name="guaranteeName" [(ngModel)]="createGuaranteeHistoryRequest.guaranteeId" required>
              <option *ngFor="let guarantee of allGuarantees.content" [ngValue]="guarantee.id">{{guarantee.brand}}{{guarantee.model}}</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="guaranteeStatus" class="form-label">Guarantee Status</label>
            <select class="form-select bg-info-subtle" id="guaranteeStatus" name="guaranteeStatus" [(ngModel)]="createGuaranteeHistoryRequest.guaranteeStatus" required>
              <option value="APPROVED">Approved</option>
              <option value="PENDING">Pending</option>
              <option value="EXPIRED">Expired</option>
              <option value="REJECTED">Rejected</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="notes" class="form-label">Notes</label>
            <input type="text" id="notes" class="form-control bg-info-subtle" name="notes" [(ngModel)]="createGuaranteeHistoryRequest.notes" required>
          </div>
          <div class="mb-3">
            <label for="feedback" class="form-label">Positive feedback</label>
            <select class="form-select bg-info-subtle" id="feedback" name="feedback" [(ngModel)]="createGuaranteeHistoryRequest.positiveFeedback" required>
              <option [ngValue]="true">YES</option>
              <option [ngValue]="false">NO</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
      <div class="modal-footer bg-dark-subtle">
        <button type="button" class="btn btn-secondary" (click)="closeModal()">Close</button>
      </div>
    </div>
  </div>
</div>
