<div class="card shadow-sm h-100 border-0 overflow-hidden rounded-4">
  <div class="card-body d-flex flex-column text-white">
    <h5 class="card-title mb-3">{{ guarantee.brand }} - {{ guarantee.model }}</h5>

    <div class="flex-grow-1">
      <p class="card-text mb-2">
        <small><strong class="text-white-50">Type:</strong> {{ guarantee.kindOfProduct }}</small>
      </p>
      <p class="card-text mb-2">
        <small><strong class="text-white-50">Status:</strong>
          <span [ngClass]="{
            'text-success': guarantee.guaranteeStatus === 'ACTIVE',
            'text-warning': guarantee.guaranteeStatus === 'PENDING',
            'text-danger': guarantee.guaranteeStatus === 'EXPIRED'
          }">
            {{ guarantee.guaranteeStatus }}
          </span>
        </small>
      </p>
      <p class="card-text mb-2">
        <small><strong class="text-white-50">From:</strong> {{ guarantee.startDate | date:'dd MMMM yyyy' }}</small>
      </p>
      <p class="card-text mb-2"> <small><strong class="text-white-50">To:</strong> {{ guarantee.endDate | date:'dd MMMM yyyy' }}</small>
      </p>
    </div>

    <div *ngIf="guarantee.documentUrl" class="mt-3">
      <a [href]="guarantee.documentUrl" target="_blank" class="btn btn-sm btn-outline-info w-100">
        Go to recipe
      </a>
    </div>
  </div> </div>
