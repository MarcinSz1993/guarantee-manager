<div *ngIf="!hasGuarantee">
  <app-no-guarantees>
  </app-no-guarantees>
</div>

<div *ngIf="hasGuarantee" class="container-fluid text-light d-flex flex-column dashboard-background" style="min-height: calc(100vh - 50px); overflow-y: auto;">
  <div class="text-center pt-4">
    <h1 class="mt-3 mb-3 fw-bold">
      <i class="fa-solid fa-shield-alt me-2"></i> Welcome {{ userName }}
    </h1>
    <h2 class="h4 text-white-50 mb-4 mb-md-5"> Below you will find your current warranties
    </h2>
  </div>

  <div class="container flex-grow-1">
    <div class="row g-3 g-md-4 justify-content-center"> <div class="col-lg-3 col-md-6 col-sm-12 d-flex" *ngFor="let guarantee of allUserGuarantees">
      <app-guarantee-card *ngIf="guarantee.id" [guarantee]="guarantee" class="w-100"></app-guarantee-card>
    </div>
    </div>
  </div>

  <nav *ngIf="totalPages > 1" aria-label="Guarantees pagination" class="mt-4 mt-md-5 pb-4"> <ul class="pagination justify-content-center">
    <li class="page-item" [class.disabled]="currentPage === 1">
      <button class="page-link" (click)="previousPage()" [disabled]="currentPage === 1">Previous</button>
    </li>
    <li class="page-item mx-1 disabled">
      <span class="page-link page-info">Page {{ currentPage }} / {{ totalPages }}</span>
    </li>
    <li class="page-item" [class.disabled]="currentPage === totalPages">
      <button class="page-link" (click)="nextPage()" [disabled]="currentPage === totalPages">Next</button>
    </li>
  </ul>
  </nav>
</div>

<app-add-guarantee
  *ngIf="isAddGuaranteeModalVisible"
  (closeModal)="closeAddGuaranteeModal()">
</app-add-guarantee>
