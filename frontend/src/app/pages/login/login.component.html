<div class="container-fluid d-flex align-items-center justify-content-center vh-100 login-page-background">
  <div class="row justify-content-center w-100">
    <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4 col-xxl-3">

      <div class="card text-bg-dark border-secondary shadow-lg rounded-4">
        <div class="card-body p-4 p-sm-5"> <div class="text-center mb-4">
          <i class="fa-solid fa-shield-keyhole fa-3x text-info mb-3"></i>
          <h1 class="h2 fw-bold mb-0">Welcome back!</h1>
          <p class="text-white-50 small">Log in to manage your guarantees.</p>
        </div>

          <div class="alert alert-danger d-flex align-items-center" role="alert" *ngIf="errorMsg.length">
            <i class="fa-solid fa-triangle-exclamation flex-shrink-0 me-2"></i>
            <div>
              {{ errorMsg }}
            </div>
          </div>

          <form (ngSubmit)="login()">

            <div class="form-floating mb-3">
              <input [(ngModel)]="loginRequest.userEmail"
                     name="email"
                     type="email"
                     class="form-control form-control-dark" id="floatingInputEmail"
                     placeholder="name@example.com" required>
            </div>

            <div class="form-floating mb-3">
              <input [(ngModel)]="loginRequest.password"
                     name="password"
                     type="password"
                     class="form-control form-control-dark" id="floatingPassword"
                     placeholder="Password" required>
            </div>

            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-info btn-lg fw-semibold">Log in</button>
            </div>

            <div class="text-end mb-4">
              <button type="button" class="btn btn-link btn-sm text-info text-decoration-none" (click)="openResetPasswordModal()">Forgot password?</button>
            </div>

            <hr class="border-light border-opacity-25 my-4"> <p class="text-center text-white-50 mb-3">Don't have an account yet?</p>
            <div class="d-grid">
              <button type="button" class="btn btn-outline-light fw-semibold" (click)="goToRegisterPage()">Register</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<app-reset-password
*ngIf="isResetPasswordModalVisible"
(closeResetPasswordModal)="closeResetPasswordModal()">
</app-reset-password>
