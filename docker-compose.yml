version: '3.8'

services:
  db:
    image: postgres:16
    container_name: guarantee-db
    environment:
      POSTGRES_DB: guarantee-manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: marcinsz1993/guarantee-manager-backend-kafka
    build:
      context: ./backend
    container_name: guarantee-backend
    ports:
      - "8081:8081"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/guarantee-manager
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

  frontend:
    image: marcinsz1993/guarantee-manager-frontend-kafka:latest
    build:
      context: ./frontend
    container_name: guarantee-frontend
    ports:
       - "80:80"

    depends_on:
      - backend
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://157.180.16.111:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_KRAFT_CLUSTER_ID: "VYuGtPUxRJKBlgMP8ah7xw"

  kafka-ui:
      image: provectuslabs/kafka-ui:latest
      ports:
        - "8082:8080"
      environment:
        KAFKA_CLUSTERS_0_NAME: guarantee-manager-dev
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      depends_on:
        - kafka

  mongodb:
      image: mongo
      container_name: mongo_db
      ports:
        - "27017:27017"
      volumes:
        - mongo:/data
      environment:
        - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USERNAME}
        - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}

  mongo-express:
      image: mongo-express
      container_name: mongo_express
      ports:
        - "8083:8081"
      environment:
        - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGODB_USERNAME}
        - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGODB_PASSWORD}
        - ME_CONFIG_MONGODB_SERVER=mongo_db

volumes:
  postgres_data:
  mongo: { }