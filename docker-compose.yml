version: '3.8'

services:
  db:
    image: postgres:16
    container_name: guarantee-db
    env_file:
      - /root/guarantee-manager/credentials.env
    environment:
      POSTGRES_DB: guarantee-manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: guarantee-manager-backend:latest
    build:
      context: ./backend
    container_name: guarantee-backend
    ports:
      - "8081:8081"
    env_file:
      - credentials.env
    depends_on:
      - db

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/guarantee-manager
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}


      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

  frontend:
    image: guarantee-manager-frontend:latest
    build:
      context: ./frontend
    container_name: guarantee-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data: